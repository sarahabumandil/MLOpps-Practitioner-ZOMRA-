groups:
  - name: arasent-alerts
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(predictions_total{status="error"}[5m]))
          / sum(rate(predictions_total[5m])) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Error rate above 1% for 5 minutes"
          first_action: "Check /health and the last deploy annotation on the dashboard."

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95, sum(rate(prediction_latency_seconds_bucket[5m])) by (le)) > 0.2
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "p95 latency above 200ms SLA for 5 minutes"
          first_action: "Check CPU utilization and inference_batch_size; consider scaling replicas."

      - alert: ConfidenceDriftPSI
        expr: arasent_confidence_psi > 0.25
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Prediction-confidence PSI exceeds 0.25 — possible vocabulary/topic drift"
          first_action: "Run monitoring/drift.py against the latest batch and compare to reports/drift_history.json."

      - alert: PredictionVolumeDrop
        expr: |
          sum(rate(predictions_total[1h])) < 0.5 * sum(rate(predictions_total[1h] offset 1d))
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Prediction volume dropped >50% vs the same hour yesterday"
          first_action: "Check upstream traffic source before assuming a model problem."
