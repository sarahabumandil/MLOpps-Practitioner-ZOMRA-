services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: dentiligence/prodml-api:0.1.0
    ports:
      - "8000:8000"
    environment:
      - PRODML_LOG_LEVEL=INFO
    volumes:
      - ../models:/app/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
